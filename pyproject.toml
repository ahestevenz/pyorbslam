[project]
name = "pyorbslam"
version = "0.0.1"
description = "pyorbslam: SLAM based on ORB-SLAM3 in C++"
authors = [
    {name = "Eduardo Davalos", email="eduardo.davalos.anaya@vanderbilt.edu"},
]
license = {file = "LICENSE.txt"}
readme = "README.md"
requires-python = ">3.6"

keywords = ["slam", "real-time", "3d", "camera"]

classifiers = [
    "Programming Language :: Python :: 3"
]

# nano-explorer: pared down to what `pyorbslam/__init__.py`'s core imports
# (orbslam3, MonoSLAM et al., state, sensor, utils) actually need. Everything
# below moved to the `viewer`/`tools` extras: they're only imported by
# trajectory_drawer/ and tools.py respectively (confirmed by grepping every
# import in this package), neither of which nano-explorer's own integration
# (`from pyorbslam import orbslam3`) touches. Declaring them as hard
# dependencies meant a plain `pip install .` on a Jetson Nano (JetPack 4.6.1 /
# Python 3.6) failed entirely trying to build PyQt5 from source: PyQt5's own
# build needs `sip`, and every sip 5.x/6.x release fails with "AttributeError:
# module 'setuptools.build_meta' has no attribute '__legacy__'" against this
# venv's pip/setuptools combination, while old-enough PyQt5 releases (<=5.14.2)
# ship a `pyproject.toml` with an invalid PEP 518 requirement string
# ('sip >=5.0.1 <6', missing a comma) that this pip's parser rejects outright
# — every PyQt5 version from 5.14.0 to 5.15.1 fails one way or the other.
#
# opencv-python-headless removed entirely (not moved to an extra) for the
# same reason nano-explorer's own requirements.txt already excludes it
# ("OpenCV 4.1.1 is bundled with JetPack — do not reinstall from pip"): no
# PyPI opencv-python-headless release publishes an aarch64+cp36 wheel, so pip
# falls back to building from source, and every source release fails one of
# two ways — "ModuleNotFoundError: No module named 'wheel.wheelfile'" (the
# scikit-build-backed releases, a wheel-package-version mismatch) or the same
# setuptools.build_meta.__legacy__ AttributeError as sip above (the
# older, setup.py-backed releases) — confirmed on-device across 5+ versions
# from 5.0.0.93 down to 4.10.0.82. The system OpenCV 4.1.1 already set up in
# Step 9b/9c is already importable as `cv2` in this venv (same as everywhere
# else in nano-explorer, e.g. lib/camera.py) — pyorbslam's own code just does
# `import cv2` and has no actual version floor that requires the PyPI package.
dependencies = [
    "numpy",
    "tqdm",
    "PyYAML",
    "Pillow",
]

[project.optional-dependencies]
# Needed only by trajectory_drawer/ (TrajectoryDrawer, TDApp) — not required
# for `from pyorbslam import orbslam3`, which is all nano-explorer uses.
viewer = [
    "PyOpenGL",
    "pyqtgraph",
    "PyQt5",
    "pyzmq",
    "simplejpeg",
    "netifaces",
    "blosc",
    "trimesh",
    "aiohttp",
]
# Needed only by tools.py — also not required for nano-explorer's use.
# pandas was missing from this list entirely upstream (tools.py imports it
# but no dependency ever declared it); added here since it belongs with the
# rest of tools.py's real dependencies.
tools = [
    "plyfile",
    "pandas",
]
test = [
    'pytest',
    'pytest-lazy-fixture',
    'pytest-rerunfailures',
    'pytest-timeout',
]
docs = [
    'sphinx',
]

[project.urls]
homepath = "https://github.com/edavalosanaya/pyorbslam"
documentation = "https://edavalosanaya.github.io/pyorbslam/"
repository = "https://github.com/edavalosanaya/pyorbslam"

[build-system]
# nano-explorer: pinned to the one and only py-build-cmake release that ever
# supported Python 3.6 (JetPack 4.6.1's stock interpreter) — every release
# from 0.1.0 onward, including the upstream ~=0.1.8 pin, requires Python >=3.7
# and simply cannot resolve/install under 3.6. Verified against PyPI's full
# release history (every 0.0.x/0.1.x+ requires_python value).
#
# tomli is an undeclared dependency of py-build-cmake==0.0.11.post1 itself:
# its own config.py does `import tomli` unconditionally (Python 3.6 has no
# stdlib tomllib), but that release's own metadata never lists tomli as a
# requirement — confirmed via PyPI's requires_dist for this exact version.
# Without it listed here too, pip's isolated build env doesn't install it and
# the build fails with "ModuleNotFoundError: No module named 'tomli'" at the
# "Getting requirements to build wheel" step. tomli 2.0+ requires Python
# >=3.7, so this needs its own upper bound for the same reason as above.
requires = ["py-build-cmake==0.0.11.post1", "tomli<2"]
build-backend = "py_build_cmake.build"

[tool.py-build-cmake.module]
name = "pyorbslam"
directory = "python-src"

[tool.py-build-cmake.sdist]
include = ["src/*"]

[tool.py-build-cmake.cmake]
minimum_version = "3.20"
build_type = "Release"
source_path = "src"
# nano-explorer: -j3 caused severe swap thrashing on a real Jetson Nano 4GB
# (ps aux showed parallel cc1plus jobs each holding ~1-1.15GB RSS, D-state
# uninterruptible sleep, and >60 minutes wall-clock for <6 minutes of actual
# CPU time on a single Sophus test TU) — dropped to single-threaded.
build_args = ["-j1"]
install_components = ['python_modules']
install_args = ['--verbose']
# find_python (auto-detect the invoking interpreter for CMake) does not exist
# in py-build-cmake 0.0.11.post1 (pinned above) — removed rather than left in,
# since that version's config parser rejects unrecognized keys outright.
# CMake's own find_package(PythonInterp)/find_package(PythonLibs) in
# src/python/CMakeLists.txt fall back to a plain PATH search instead, which
# still resolves correctly as long as the target virtualenv is active (its
# bin/ is first on PATH) when running `pip install .`.

# Reference:
# https://stackoverflow.com/questions/4673373/logging-within-pytest-tests
[tool.pytest.ini_options]

# Logging + CLI
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s.%(msecs)03d [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Timeout
faulthandler_timeout=300

# Ignore warnings
filterwarnings = "ignore::DeprecationWarning"
